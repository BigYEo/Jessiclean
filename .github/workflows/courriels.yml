name: Courriels clients (confirmations et rappels)

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:                       # aussi à chaque mise à jour du site
    branches: [main]

concurrency:
  group: courriels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer
        run: npm install --omit=dev --no-audit --no-fund
      - name: Envoyer les courriels
        run: node emailer.mjs
        env:
          TZ: America/Toronto
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: admin@jessiclean.ca
          # Horaire du site envoyé dans Outlook (invitations de calendrier)
          CAL_TO: admin@jessiclean.ca,jessiclean@outlook.com
          # Ne pas renvoyer à cette adresse les ménages importés de son propre Outlook (évite les doublons)
          CAL_SKIP_OUTLOOK: jessiclean@outlook.com
          # Facultatif : clé SMTP Brevo pour que les invitations s'ajoutent toutes seules au calendrier
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
